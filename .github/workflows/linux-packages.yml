# Builds the .deb, .rpm, .snap and .flatpak packages from the release's AppImage (so every Linux package
# ships the exact same app), installs each one on a clean machine, opens the app, steps through its main
# pages, and attaches only the packages that passed to the release.
name: Linux packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v2.7.0)
        required: true
      packages_from_run:
        description: Optional run id whose built packages to test again instead of rebuilding
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  KROMA_DEBUG_PORT: '9333'

jobs:
  build:
    if: ${{ !inputs.packages_from_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack the AppImage
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Kroma-*-x86_64.AppImage' --dir appimage
          cd appimage && chmod +x Kroma-*.AppImage && ./Kroma-*.AppImage --appimage-extract > /dev/null
          # Keep only the app itself: drop the AppImage launcher, icons and desktop file at the root.
          rm -rf squashfs-root/AppRun squashfs-root/.DirIcon squashfs-root/*.desktop squashfs-root/*.png squashfs-root/usr
          # --appimage-extract leaves directories readable by the owner only; installed users need read/execute.
          chmod -R u+rwX,go+rX,go-w squashfs-root
          test -x squashfs-root/kroma-ecosystem && test -f squashfs-root/resources/app.asar
          stat -c '%A %n' squashfs-root squashfs-root/kroma-ecosystem squashfs-root/resources
          ls squashfs-root

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd linux && npm pkg set version="${TAG#v}" && npm install --no-audit --no-fund

      - name: Build .deb and .rpm
        # Each package carries resources/package-type, which the in-app updater reads to install
        # the right kind of update (dpkg for .deb, rpm/dnf for .rpm).
        working-directory: linux
        run: |
          for t in deb rpm; do
            rm -rf "../root-$t" && cp -a ../appimage/squashfs-root "../root-$t"
            echo "$t" > "../root-$t/resources/package-type"
            npx electron-builder --prepackaged "../root-$t" --linux "$t" --x64 --publish never
          done

      - name: Build .flatpak
        id: flatpak
        continue-on-error: true
        working-directory: linux
        run: npx electron-builder --prepackaged ../appimage/squashfs-root --linux flatpak --x64 --publish never

      - name: List packages
        run: ls -la linux/dist/*.deb linux/dist/*.rpm linux/dist/*.snap linux/dist/*.flatpak 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            linux/dist/*.deb
            linux/dist/*.rpm
            linux/dist/*.flatpak
          if-no-files-found: error
          retention-days: 14

  build-snap:
    # snapcraft packages the same app files as the AppImage, with the GNOME extension for desktop
    # integration. Always built in this run, even when the other packages are reused.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the AppImage into the snap project
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Kroma-*-x86_64.AppImage' --dir appimage
          cd appimage && chmod +x Kroma-*.AppImage && ./Kroma-*.AppImage --appimage-extract > /dev/null && cd ..
          rm -rf appimage/squashfs-root/AppRun appimage/squashfs-root/.DirIcon appimage/squashfs-root/*.desktop appimage/squashfs-root/*.png appimage/squashfs-root/usr
          chmod -R u+rwX,go+rX,go-w appimage/squashfs-root
          # A snap cannot ship a setuid-root helper, so drop chrome-sandbox: Chromium then uses its
          # user-namespace sandbox, which browser-support (allow-sandbox) permits. The app stays sandboxed.
          rm -f appimage/squashfs-root/chrome-sandbox
          mv appimage/squashfs-root linux/snap-build/app
          sed -i "s/^version: .*/version: '${TAG#v}'/" linux/snap-build/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: linux/snap-build
      - name: Name the snap
        run: mkdir -p snap-out && mv "${{ steps.snapcraft.outputs.snap }}" "snap-out/Kroma-${TAG#v}-amd64.snap" && ls -la snap-out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap
          path: snap-out/*.snap
          retention-days: 14

  test-deb:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.packages_from_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install the .deb
        run: |
          sudo apt-get update
          set -x
          sudo apt-get install -y ./pkg/*.deb xvfb
          dpkg -L kroma-ecosystem | grep -v '^/opt/Kroma Ecosystem/' || true
          ls -la "/opt/Kroma Ecosystem/kroma-ecosystem" "/opt/Kroma Ecosystem/chrome-sandbox"
          test -x "/opt/Kroma Ecosystem/kroma-ecosystem"
          # The menu entry's file name comes from electron-builder; find it by content, not by name.
          desktop=$(grep -l -i 'kroma' /usr/share/applications/*.desktop | head -1)
          test -n "$desktop" && echo "menu entry: $desktop" && grep -E '^(Name|Exec|Icon)=' "$desktop"
      - name: Open the app and test its pages
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' bash -c '"/opt/Kroma Ecosystem/kroma-ecosystem" --remote-debugging-port=$KROMA_DEBUG_PORT > app.log 2>&1 & node .github/smoke/smoke.mjs out-deb || { tail -n 80 app.log; exit 1; }'
      - name: Uninstall
        run: sudo apt-get remove -y kroma-ecosystem && test ! -e "/opt/Kroma Ecosystem/kroma-ecosystem"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-deb, path: out-deb, retention-days: 14 }

  test-rpm:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.packages_from_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install the .rpm
        run: |
          dnf install -y ./pkg/*.rpm nodejs xorg-x11-server-Xvfb xorg-x11-xauth
          test -x "/opt/Kroma Ecosystem/kroma-ecosystem"
      - name: Open the app and test its pages
        # The container runs as root, where Chromium refuses its sandbox; a normal Fedora user keeps it.
        run: |
          # Run as a normal user so permission problems in the package show up (root can read anything).
          # Chromium's sandbox cannot start inside this container, so --no-sandbox is for the test only.
          useradd -m tester
          chmod -R a+rwX . && mkdir -p out-rpm && chmod 777 out-rpm
          runuser -u tester -- xvfb-run -a -s '-screen 0 1440x900x24' bash -c '"/opt/Kroma Ecosystem/kroma-ecosystem" --no-sandbox --remote-debugging-port=$KROMA_DEBUG_PORT > /tmp/app.log 2>&1 & KROMA_DEBUG_PORT=$KROMA_DEBUG_PORT node .github/smoke/smoke.mjs out-rpm || { tail -n 80 /tmp/app.log; exit 1; }'
      - name: Uninstall
        run: dnf remove -y kroma-ecosystem && test ! -e "/opt/Kroma Ecosystem/kroma-ecosystem"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-rpm, path: out-rpm, retention-days: 14 }

  test-appimage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download the AppImage
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Kroma-*-x86_64.AppImage' --dir appimage
          chmod +x appimage/*.AppImage
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2 || sudo apt-get install -y xvfb libfuse2t64
      - name: Open the app and test its pages
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' bash -c 'appimage/Kroma-*.AppImage --remote-debugging-port=$KROMA_DEBUG_PORT > app.log 2>&1 & node .github/smoke/smoke.mjs out-appimage'
      - name: App log
        if: always()
        run: tail -n 40 app.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-appimage-${{ matrix.os }}
          path: out-appimage
          retention-days: 14

  test-snap:
    needs: build-snap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: linux-snap
          path: pkg
      - name: Install the .snap
        run: |
          ls pkg/*.snap
          sudo snap install --dangerous pkg/*.snap
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Open the app and check its window
        # A strictly confined snap may not open a listening port (no network-bind plug), so instead of the
        # DevTools page walk this checks that the window appears, stays open and draws a non-blank screen.
        run: |
          sudo apt-get install -y x11-utils xdotool imagemagick
          mkdir -p out-snap
          Xvfb :99 -screen 0 1440x900x24 & sleep 2
          DISPLAY=:99 snap run kroma-ecosystem > app.log 2>&1 &
          for i in $(seq 1 60); do DISPLAY=:99 xdotool search --name 'Kroma' > /dev/null 2>&1 && break; sleep 2; done
          DISPLAY=:99 xdotool search --name 'Kroma' || { echo 'No Kroma window appeared'; tail -n 60 app.log; exit 1; }
          sleep 25
          pgrep -f 'kroma-ecosystem' > /dev/null || { echo 'The app quit'; tail -n 60 app.log; exit 1; }
          DISPLAY=:99 import -window root out-snap/screen.png
          sd=$(convert out-snap/screen.png -colorspace gray -format '%[fx:standard_deviation]' info:)
          echo "screen std-dev: $sd"; tail -n 20 app.log
          awk -v s="$sd" 'BEGIN { exit !(s > 0.05) }' || { echo 'The window is blank'; exit 1; }
          if grep -qi 'no-sandbox\|sandbox is disabled' app.log; then echo 'The app ran without its sandbox'; exit 1; fi
          echo PASSED
      - name: Uninstall
        run: sudo snap remove kroma-ecosystem
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-snap, path: out-snap, retention-days: 14 }

  test-flatpak:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.packages_from_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install the .flatpak
        run: |
          ls pkg/*.flatpak
          sudo apt-get update && sudo apt-get install -y flatpak xvfb dbus dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive pkg/*.flatpak
      - name: Open the app and check its window
        # Same check as the snap: the window appears, stays open and draws a non-blank screen.
        run: |
          sudo apt-get install -y x11-utils xdotool imagemagick
          mkdir -p out-flatpak
          Xvfb :99 -screen 0 1440x900x24 & sleep 2
          DISPLAY=:99 dbus-run-session -- flatpak run com.kroma.ecosystem > app.log 2>&1 &
          for i in $(seq 1 60); do DISPLAY=:99 xdotool search --name 'Kroma' > /dev/null 2>&1 && break; sleep 2; done
          DISPLAY=:99 xdotool search --name 'Kroma' || { echo 'No Kroma window appeared'; tail -n 80 app.log; exit 1; }
          sleep 25
          flatpak ps | grep -q com.kroma.ecosystem || { echo 'The app quit'; tail -n 80 app.log; exit 1; }
          DISPLAY=:99 import -window root out-flatpak/screen.png
          sd=$(convert out-flatpak/screen.png -colorspace gray -format '%[fx:standard_deviation]' info:)
          echo "screen std-dev: $sd"; tail -n 20 app.log
          awk -v s="$sd" 'BEGIN { exit !(s > 0.05) }' || { echo 'The window is blank'; exit 1; }
          echo PASSED
      - name: Uninstall
        run: flatpak uninstall --user -y --noninteractive com.kroma.ecosystem
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-flatpak, path: out-flatpak, retention-days: 14 }

  publish:
    needs: [build, build-snap, test-deb, test-rpm, test-snap, test-flatpak]
    if: ${{ always() && (needs.build.result == 'success' || inputs.packages_from_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: needs.build-snap.result == 'success'
        with:
          name: linux-snap
          path: pkg
      - name: Attach the packages that passed
        env:
          DEB: ${{ needs.test-deb.result }}
          RPM: ${{ needs.test-rpm.result }}
          SNAP: ${{ needs.test-snap.result }}
          FLATPAK: ${{ needs.test-flatpak.result }}
        run: |
          files=()
          [ "$DEB" = success ] && files+=(pkg/*.deb)
          [ "$RPM" = success ] && files+=(pkg/*.rpm)
          [ "$SNAP" = success ] && files+=(pkg/*.snap)
          [ "$FLATPAK" = success ] && files+=(pkg/*.flatpak)
          echo "deb=$DEB rpm=$RPM snap=$SNAP flatpak=$FLATPAK"
          if [ ${#files[@]} -gt 0 ]; then gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber; fi
          for f in "${files[@]}"; do sha256sum "$f"; done
      - name: Publish the Linux update manifest
        # latest-linux.yml tells installed apps about this version: the AppImage plus every .deb/.rpm that passed,
        # each with its size and base64 sha512, which the updater checks before installing.
        env:
          DEB: ${{ needs.test-deb.result }}
          RPM: ${{ needs.test-rpm.result }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Kroma-*-x86_64.AppImage' --dir pkg --clobber
          manifest=(pkg/*.AppImage)
          [ "$DEB" = success ] && manifest+=(pkg/*.deb)
          [ "$RPM" = success ] && manifest+=(pkg/*.rpm)
          python3 - "${TAG#v}" "${manifest[@]}" > latest-linux.yml <<'PY'
          import base64, datetime, hashlib, os, sys
          version, files = sys.argv[1], sys.argv[2:]
          def sha512(p):
              h = hashlib.sha512()
              with open(p, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return base64.b64encode(h.digest()).decode()
          entries = [(os.path.basename(p), sha512(p), os.path.getsize(p)) for p in files]
          print(f'version: {version}')
          print('files:')
          for name, sha, size in entries:
              print(f'  - url: {name}')
              print(f'    sha512: {sha}')
              print(f'    size: {size}')
          print(f'path: {entries[0][0]}')
          print(f'sha512: {entries[0][1]}')
          print(f"releaseDate: '{datetime.datetime.utcnow().isoformat(timespec='milliseconds')}Z'")
          PY
          cat latest-linux.yml
          gh release upload "$TAG" latest-linux.yml --repo "$GITHUB_REPOSITORY" --clobber
